<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#246347" />

  <title>DockMap</title>

  <link rel="manifest" href="./manifest.webmanifest" />

<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="Images/dockmap-180.png"
/>

  <link rel="stylesheet" href="style.css" />
  <link
    rel="icon"
    href="Images/dockmap-logo-icon.svg"
    type="image/svg+xml"
  />

  <!-- Google Analytics -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-4L84Q4V2CJ"
  ></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-4L84Q4V2CJ");
  </script>
</head>

<body>
  <!-- Logo et compteur -->
  <header class="topbar">
    <a class="brand" href="./">
      <img
        class="brand-logo"
        src="Images/dockmap-logo-icon.svg"
        alt=""
        aria-hidden="true"
      />
      <span>DockMap</span>
    </a>

    <span id="totalSaved">Today saved: 0 min</span>
  </header>

  <main class="container">
    <!-- Présentation simplifiée -->
    <header class="hero">
      <h1>Find your delivery entrance.</h1>
    </header>

    <!-- Recherche -->
    <section class="search-box" aria-label="Find a building">
      <label for="searchInput">Building address</label>

      <div class="search-row">
        <div class="search-wrapper">
          <input
            type="search"
            id="searchInput"
            placeholder="e.g. 50 W 34th St"
            autocomplete="off"
            aria-controls="suggestions"
            aria-expanded="false"
          />

          <div id="suggestions" class="suggestions"></div>
        </div>

        <button id="searchBtn" type="button">
          Search
          <span aria-hidden="true">→</span>
        </button>
      </div>

      <p id="searchStatus" role="status">
        Loading addresses…
      </p>
    </section>

    <!-- Installation : activée lors de l'ajout du JavaScript -->
    <section
      id="installBanner"
      class="install-banner"
      aria-labelledby="installTitle"
      hidden
    >
      <img
        class="install-logo"
        src="Images/dockmap-logo-icon.svg"
        width="40"
        height="40"
        alt=""
        aria-hidden="true"
      />

      <div class="install-content">
        <h2 id="installTitle">Add DockMap to your phone</h2>

        <button
          id="installButton"
          class="install-button"
          type="button"
        >
          Add to home screen
        </button>
      </div>

      <button
        id="dismissInstall"
        class="install-dismiss"
        type="button"
        aria-label="Dismiss installation suggestion"
      >
        ×
      </button>
    </section>

    <!-- Résultat rempli par le JavaScript -->
    <section
      id="result"
      class="result hidden"
      aria-label="Entrance details"
    ></section>

    <footer>
      <p>Made for deliveries. Built around the right entrance.</p>

      <button
        id="installFooterButton"
        class="install-footer-button"
        type="button"
        hidden
      >
        Add DockMap to your phone
      </button>
    </footer>
  </main>

  <!-- Affichage des photos en grand -->
  <dialog id="photoDialog" aria-label="Entrance photos">
    <button
      class="dialog-close"
      type="button"
      aria-label="Close photo"
    >
      ×
    </button>

    <img id="fullPhoto" alt="" />

    <div class="dialog-tools">
      <button
        class="previous"
        type="button"
        aria-label="Previous photo"
      >
        ←
      </button>

      <span class="photo-count"></span>

      <button
        class="next"
        type="button"
        aria-label="Next photo"
      >
        →
      </button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
